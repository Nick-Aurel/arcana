<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcana</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1917;
        --muted: #78716c;
        --bg0: #faf7f2;
        --bg1: #efe8dc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
          serif;
        background:
          radial-gradient(1200px 600px at 10% -10%, #fff 0%, transparent 55%),
          linear-gradient(160deg, var(--bg0), var(--bg1));
        color: var(--ink);
      }
      main {
        min-height: 100%;
        display: grid;
        place-content: center;
        text-align: center;
        padding: 2rem;
        gap: 0.75rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 3.75rem);
        letter-spacing: -0.03em;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }
      .pulse {
        width: 2.5rem;
        height: 2.5rem;
        margin: 1.25rem auto 0;
        border-radius: 999px;
        border: 2px solid color-mix(in srgb, var(--ink) 25%, transparent);
        border-top-color: var(--ink);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Arcana</h1>
      <p>Starting local notes server…</p>
      <div class="pulse" aria-hidden="true"></div>
    </main>
  </body>
</html>
